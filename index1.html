<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuditech | Upgrading Human Potential</title>
    <meta name="description" content="Welcome to a new era of human performance management. Continuous biosensing and real-time biological data processing.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="styles.css">

    <!-- Three.js library for 3D dynamic background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
</head>

<body class="page-layout">

    <!-- 3D DYNAMIC CANVAS -->
    <div id="bg-canvas-container" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none; background:#030712;">
        <canvas id="wave-canvas"></canvas>
    </div>

    <header class="site-header">
        <div class="header-container">
            
            <a href="#home" class="logo-wrapper">
                <img src="images/logos-nudi-purple.svg" alt="Nuditech logo" class="logo-image" onerror="this.src='https://placehold.co/32x32/6366f1/ffffff?text=N'">
                <span class="logo-text">
                    Nuditech<span class="text-accent">.</span>
                </span>
            </a>

            <!-- Right Header Group (Desktop Nav + Hamburger Menu) -->
            <div class="right-header-group">
                <nav class="desktop-nav">
                    <a href="https://www.nuditech.com/polar-h10-data-reader/" target="_blank" rel="noopener noreferrer" class="nav-link">Polar H10 BLE Reader</a>
                </nav>
            </div>

        </div>
    </header>

    <!-- MOBILE MENU DRAWER -->
    <div id="mobile-menu-wrapper" class="mobile-menu-wrapper">

    </div>

    <main class="main-content" id="home">
    </main>

    <footer class="site-footer" id="contact">
    </footer>

    <!-- EXTERNAL JS SCRIPT FOR 3D BACKGROUND -->
    <script src="scripts/background.js" defer></script>

    <script src="scripts/menu-desplegable.js" defer></script>
</body>
</html>
