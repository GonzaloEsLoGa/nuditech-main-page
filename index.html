<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuditech | En Mantenimiento</title>
    <meta name="description" content="Nuditech">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>

<body class="page-layout">
    
    <div class="background-wrapper">
        <img 
            src="images\background-image-main.png" 
            alt="Fondo Tecnológico Nuditech" 
            class="background-image"
        />
        <!-- <div class="background-overlay"></div> --> 
    </div>

    <!-- HEADER -->
    <header class="site-header">
        <div class="logo-wrapper">
            <img
                src="images/logos-nudi-purple.svg"
                alt="logo"
                class="logo-image">
            <h1 class="logo-text">
                Nuditech<span class="text-accent">.</span>
            </h1>
        </div>
        
        <nav class="dropdown-wrapper" id="toolsDropdown">
            <button class="dropdown-trigger" id="dropdownBtn" aria-haspopup="true" aria-expanded="false">
                <span>Herramientas</span>
                <svg class="chevron-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>

            <!-- Menú Flotante -->
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="https://www.nuditech.com/polar-h10-data-reader/" target="_blank" rel="noopener noreferrer" class="dropdown-item">
                    <span>Polar H10 BLE Reader</span>
                    <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </a>
            </div>
        </nav>
    </header>

    <script src="script.js" defer></script>
</body>
</html>
