    <script src="script.js" defer></script>
    <!-- Fondo de Partículas 3D con Three.js -->

    <script>
    // Configuración avanzada de malla de partículas con textura brillante y reacción 3D
    const AMOUNTX = 100, AMOUNTY = 75;
    const SEPARATION = 45;

    let container, camera, scene, renderer, particleSystem;
    let positions, colors;
    let count = 0;

    let mouseX = 0, mouseY = 0;
    let targetMouseX = 0, targetMouseY = 0;
    const windowHalfX = window.innerWidth / 2;
    const windowHalfY = window.innerHeight / 2;

    // Colores de marca: Púrpura -> Azul/Cian -> Verde Esmeralda
    const c1 = new THREE.Color('#8B5CF6'); 
    const c2 = new THREE.Color('#06B6D4'); 
    const c3 = new THREE.Color('#10B981'); 

    // Genera una textura de partícula brillante y redondeada mediante Canvas 2D
    function createParticleTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');

        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.3, 'rgba(255,255,255,0.8)');
        gradient.addColorStop(0.7, 'rgba(255,255,255,0.2)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(32, 32, 32, 0, Math.PI * 2);
        ctx.fill();

        return new THREE.CanvasTexture(canvas);
    }

    function init() {
        container = document.getElementById('bg-canvas-container');
        const canvasEl = document.getElementById('wave-canvas');
        if (!container || !canvasEl) return;

        // Configuración de Cámara y Escena
        camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 1, 10000);
        camera.position.z = 1100;
        camera.position.y = 450;

        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030712, 0.0004);

        // Crear Arrays de Posiciones y Colores
        const numParticles = AMOUNTX * AMOUNTY;
        positions = new Float32Array(numParticles * 3);
        colors = new Float32Array(numParticles * 3);

        let i = 0;
        for (let ix = 0; ix < AMOUNTX; ix++) {
            for (let iy = 0; iy < AMOUNTY; iy++) {
                positions[i] = ix * SEPARATION - ((AMOUNTX * SEPARATION) / 2);
                positions[i + 1] = 0;
                positions[i + 2] = iy * SEPARATION - ((AMOUNTY * SEPARATION) / 2);

                const t = ix / AMOUNTX;
                let color = new THREE.Color();
                if (t < 0.5) { color.lerpColors(c1, c2, t * 2); } 
                else { color.lerpColors(c2, c3, (t - 0.5) * 2); }

                colors[i] = color.r; 
                colors[i + 1] = color.g; 
                colors[i + 2] = color.b;
                i += 3;
            }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Material con mezcla aditiva para resplandor y cero manchas cuadradas
        const material = new THREE.PointsMaterial({
            size: 13.2,
            map: createParticleTexture(),
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x030712, 1);

        // Eventos de ratón, táctil y redimensionamiento
        // document.addEventListener('mousemove', onMouseMove);
        // document.addEventListener('touchmove', onTouchMove, { passive: true });
        // window.addEventListener('resize', onWindowResize);

        animate();
    }

    function onMouseMove(event) {
        targetMouseX = (event.clientX - windowHalfX) * 0.4;
        targetMouseY = (event.clientY - windowHalfY) * 0.4;
    }

    function onTouchMove(event) {
        if (event.touches.length === 1) {
            targetMouseX = (event.touches[0].pageX - windowHalfX) * 0.4;
            targetMouseY = (event.touches[0].pageY - windowHalfY) * 0.4;
        }
    }

    function onWindowResize() {
        if (!camera || !renderer) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        render();
    }

    function render() {
        if (!particleSystem) return;

        // Inercia suave en la cámara con el ratón
        mouseX += (targetMouseX - mouseX) * 0.05;
        mouseY += (targetMouseY - mouseY) * 0.05;

        camera.position.x = mouseX * 0.8;
        camera.position.y = 450 + (-mouseY * 0.8);
        camera.lookAt(0, 0, 0);

        // Algoritmo multinivel de onda senoidal
        const positionArray = particleSystem.geometry.attributes.position.array;
        let i = 0;
        for (let ix = 0; ix < AMOUNTX; ix++) {
            for (let iy = 0; iy < AMOUNTY; iy++) {
                const waveX = Math.sin((ix + count) * 0.25) * 63;
                const waveY = Math.cos((iy + count) * 0.35) * 63;
                const diagonal = Math.sin((ix + iy + count) * 0.15) * 45;

                positionArray[i + 1] = waveX + waveY + diagonal;
                i += 3;
            }
        }

        particleSystem.geometry.attributes.position.needsUpdate = true;
        count += 0.001;

        renderer.render(scene, camera);
    }

    // Inicialización segura
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
